<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; }
  /* 로드 전에도 16:9 자리를 유지한다 — 안 그러면 영상이 붙는 순간 레이아웃이 튄다 */
  video { width: 100%; aspect-ratio: 16 / 9; display: block;
          background: #06090f; border-radius: 12px; }
</style>
</head>
<body>
<video id="vid" controls preload="auto"></video>

<script>
  function stReady() {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  }
  function stHeight(h) {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
  }
  function stValue(val) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: JSON.stringify(val),
      dataType: "json"
    }, "*");
  }

  var vid          = document.getElementById("vid");
  var pollInterval = null;
  var lastSeekTo   = -1;
  var lastSentTime = -999;
  var lastSentPlaying = null;
  var initialized  = false;

  window.addEventListener("message", function(e) {
    if (e.data.type !== "streamlit:render") return;
    var args = e.data.args;

    if (!initialized && args.video_url) {
      vid.src = args.video_url;
      initialized = true;

      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(function() {
        var t = vid.currentTime;
        var playing = !vid.paused && !vid.ended;
        var timeChanged    = Math.abs(t - lastSentTime) >= 0.2;
        var playingChanged = playing !== lastSentPlaying;
        if (timeChanged || playingChanged) {
          lastSentTime    = t;
          lastSentPlaying = playing;
          stValue({ time: t, playing: playing });
        }
      }, 200);
    }

    if (!args || !vid.src) return;

    var st = args.seek_to;
    if (st != null && Math.abs(st - lastSeekTo) > 0.5) {
      lastSeekTo = st;
      vid.currentTime = st;
    }

    var wantPlay = args.is_playing;
    if (wantPlay && vid.paused)  { vid.play().catch(function(){}); }
    if (!wantPlay && !vid.paused){ vid.pause(); }
  });

  // iframe 높이를 영상 실제 높이에 맞춘다. 480px 고정이던 시절에는 영상이 로드되기
  // 전(<video>가 125px로 쪼그라든 상태)에 355px가 빈 검은 영역으로 남아 화면을 잡아먹었다.
  // aspect-ratio 16/9가 걸려 있어 로드 전후 높이가 같으므로 레이아웃이 튀지 않는다.
  function syncHeight() {
    stHeight(Math.ceil(vid.getBoundingClientRect().height));
  }

  window.addEventListener("resize", syncHeight);
  vid.addEventListener("loadedmetadata", syncHeight);

  stReady();
  syncHeight();
</script>
</body>
</html>
